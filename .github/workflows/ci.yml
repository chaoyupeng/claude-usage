name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Recorded in the log so a toolchain bump that changes behaviour is
      # traceable to the run that first saw it.
      - name: Toolchain
        run: |
          xcode-select -p
          swift --version

      # Day and minute bucketing is local-time based, so the suite runs across a
      # whole-hour offset, a half-hour offset, a negative offset and UTC itself.
      # A UTC-only run would pass even if the bucketing regressed to UTC keys.
      - name: Test
        working-directory: macos
        run: swift test

      - name: Test (TZ=Australia/Sydney)
        working-directory: macos
        env:
          TZ: Australia/Sydney
        run: swift test

      - name: Test (TZ=Australia/Adelaide)
        working-directory: macos
        env:
          TZ: Australia/Adelaide
        run: swift test

      - name: Test (TZ=America/Los_Angeles)
        working-directory: macos
        env:
          TZ: America/Los_Angeles
        run: swift test
